<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrimeDox AI</title>
<meta name="theme-color" content="#D4AF37">
<meta name="description" content="Francisco Holdings legal document generator — educational tool, not legal advice.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="icon" href="icon-192.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-view" class="screen">
  <div class="card login-card">
    <h1 class="brand">Prime<span class="accent">Dox</span> AI</h1>
    <p class="brand-sub">Francisco Holdings Inc.</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-gold">Log In</button>
      <div class="hint">Demo login for this app — no account verification yet (no backend connected).</div>
    </form>
  </div>
</div>

<div id="app-view" class="screen hidden">
  <header class="topbar">
    <h1 class="brand small">Prime<span class="accent">Dox</span> AI</h1>
    <button id="logout-btn" class="btn btn-ghost">Log Out</button>
  </header>

  <main class="card">
    <label for="template-select">Document Template</label>
    <select id="template-select"></select>

    <button id="generate-btn" class="btn btn-gold">Generate Document</button>

    <div class="result-wrap">
      <div class="result-label">Result</div>
      <pre id="result-display">Select a template and click Generate to see a draft here.</pre>
    </div>
  </main>
</div>

<footer class="disclaimer">
  Doc Weedlaw is a legal educator, not a lawyer
</footer>

<script src="app.js"></script>
</body>
</html>
