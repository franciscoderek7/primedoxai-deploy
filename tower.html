<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Francisco Holdings Inc. — Tower</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, Arial, sans-serif; }
  #root { position: fixed; inset: 0; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
         padding: 14px 18px; background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0));
         z-index: 10; pointer-events: none; }
  #hud .brand { color: #D4AF37; font-weight: 700; letter-spacing: 1px; font-size: 14px; pointer-events: auto; }
  #status { color: #c0c0c0; font-size: 12px; pointer-events: auto; }
  #floor-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; justify-content: center;
               flex-wrap: wrap; padding: 16px; background: linear-gradient(0deg, rgba(0,0,0,0.85), rgba(0,0,0,0)); z-index: 10; }
  .floor-btn { background: #111; border: 1px solid #D4AF37; color: #D4AF37; font-size: 11px;
               padding: 9px 14px; border-radius: 6px; cursor: pointer; letter-spacing: 0.3px; transition: all .15s; }
  .floor-btn:hover { background: #D4AF37; color: #000; }
  .floor-btn.active { background: #D4AF37; color: #000; }
  .floor-btn.real { border-color: #3ddc97; }
  .floor-btn.real:hover, .floor-btn.real.active { background: #3ddc97; border-color: #3ddc97; color: #000; }
</style>
</head>
<body>

<div id="root"></div>

<div id="hud">
  <div class="brand">FRANCISCO HOLDINGS — TOWER</div>
  <div id="status">Loading Floor 1...</div>
</div>

<div id="floor-bar"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
  import { FloorManager, getRegisteredFloorIds } from './engine/FloorManager.js';

  // Floors with a real Three.js scene wired in (see floors/FloorN/FloorNScene.js).
  // Everything else still mounts via FloorManager but renders the
  // FloorInterface-compliant DOM placeholder until built out.
  const REAL_FLOORS = new Set([1, 2, 3]);

  const FLOOR_LABELS = {
    1: 'Francisco Holdings HQ',
    2: 'OMNIAGUARD',
    3: 'PrimeDox AI',
    4: 'CCLDR / Doc Weedlaw',
    5: 'TechPetCage',
    6: 'Vault Velocity Auto',
    7: 'Kiaros',
    8: 'CleanSwarm',
    9: 'Neural Graph',
    10: 'SoulStack',
  };

  const root = document.getElementById('root');
  const status = document.getElementById('status');
  const floorBar = document.getElementById('floor-bar');
  const manager = new FloorManager(root);

  let activeBtn = null;

  async function goToFloor(floorId, btn) {
    status.textContent = `Loading Floor ${floorId}...`;
    try {
      await manager.mountFloor(floorId);
      status.textContent = `Floor ${floorId} — ${FLOOR_LABELS[floorId] ?? ''}`;
      activeBtn?.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
    } catch (err) {
      status.textContent = `Error: ${err.message}`;
      console.error(err);
    }
  }

  getRegisteredFloorIds().forEach((floorId) => {
    const btn = document.createElement('button');
    btn.className = 'floor-btn' + (REAL_FLOORS.has(floorId) ? ' real' : '');
    btn.textContent = `${floorId} — ${FLOOR_LABELS[floorId] ?? 'Floor ' + floorId}`;
    btn.onclick = () => goToFloor(floorId, btn);
    floorBar.appendChild(btn);
    if (floorId === 1) goToFloor(1, btn);
  });
</script>

</body>
</html>
