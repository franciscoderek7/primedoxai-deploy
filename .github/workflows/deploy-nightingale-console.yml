name: Deploy Nightingale Console to GitHub Pages

on:
  push:
    branches: [main, claude/francisco-revenue-sprint-MEva6]
    paths:
      - 'nightingale-console/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Clone or create nightingale-console repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/nightingale-console.git /tmp/nightingale-console 2>/dev/null || {
            mkdir -p /tmp/nightingale-console
            cd /tmp/nightingale-console
            git init
            git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/nightingale-console.git
          }
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Copy console files
        run: |
          cd nightingale-console
          find . -type f | while read f; do
            dir=$(dirname "$f")
            mkdir -p "/tmp/nightingale-console/$dir"
            cp "$f" "/tmp/nightingale-console/$f"
          done
          touch /tmp/nightingale-console/.nojekyll
          echo "Files copied"

      - name: Commit and push
        run: |
          cd /tmp/nightingale-console
          git config user.email "deploy@franciscoholdingsinc.com"
          git config user.name "Nightingale Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: nightingale-console @ ${{ github.sha }}" || echo "Nothing to commit"
          git push origin main || git push --set-upstream origin main
          echo "Deployed: franciscoderek7.github.io/nightingale-console"
