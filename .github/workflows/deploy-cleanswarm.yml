name: Deploy CleanSwarm

on:
  push:
    branches: [main, claude/francisco-revenue-sprint-MEva6]
    paths:
      - 'cleanswarm-site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Clone or init cleanswarm repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/cleanswarm.git /tmp/cleanswarm 2>/dev/null || {
            mkdir -p /tmp/cleanswarm
            cd /tmp/cleanswarm
            git init -b main
            git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/cleanswarm.git
          }
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Wipe and copy site files
        run: |
          find /tmp/cleanswarm -mindepth 1 -not -path '/tmp/cleanswarm/.git*' -delete 2>/dev/null || true
          cp -r cleanswarm-site/. /tmp/cleanswarm/
          touch /tmp/cleanswarm/.nojekyll
          echo "Copied $(ls cleanswarm-site/*.html 2>/dev/null | wc -l) HTML files"

      - name: Commit and push
        run: |
          cd /tmp/cleanswarm
          git config user.email "deploy@franciscoholdingsinc.com"
          git config user.name "Empire Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: cleanswarm @ ${{ github.sha }}" || echo "Nothing to commit"
          git push origin main || git push --set-upstream origin main
          echo "Live: franciscoderek7.github.io/cleanswarm"
