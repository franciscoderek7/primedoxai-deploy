name: Deploy Agent Swarm Technologies

on:
  push:
    branches: [main, claude/francisco-revenue-sprint-MEva6]
    paths:
      - 'agent-swarm-tech-site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Clone or init agent-swarm-tech repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/agent-swarm-tech.git /tmp/agent-swarm-tech 2>/dev/null || {
            mkdir -p /tmp/agent-swarm-tech
            cd /tmp/agent-swarm-tech
            git init -b main
            git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/agent-swarm-tech.git
          }
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Wipe and copy site files
        run: |
          find /tmp/agent-swarm-tech -mindepth 1 -not -path '/tmp/agent-swarm-tech/.git*' -delete 2>/dev/null || true
          cp -r agent-swarm-tech-site/. /tmp/agent-swarm-tech/
          touch /tmp/agent-swarm-tech/.nojekyll
          echo "Copied $(ls agent-swarm-tech-site/*.html 2>/dev/null | wc -l) HTML files"

      - name: Commit and push
        run: |
          cd /tmp/agent-swarm-tech
          git config user.email "deploy@franciscoholdingsinc.com"
          git config user.name "Empire Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: agent-swarm-tech @ ${{ github.sha }}" || echo "Nothing to commit"
          git push origin main || git push --set-upstream origin main
          echo "Live: franciscoderek7.github.io/agent-swarm-tech"
