name: Deploy Constitutional Defense Labs

on:
  push:
    branches: [main, claude/francisco-revenue-sprint-MEva6]
    paths:
      - 'constitutional-defense-labs-site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Clone or init constitutional-defense-labs repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/constitutional-defense-labs.git /tmp/constitutional-defense-labs 2>/dev/null || {
            mkdir -p /tmp/constitutional-defense-labs
            cd /tmp/constitutional-defense-labs
            git init -b main
            git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/constitutional-defense-labs.git
          }
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Wipe and copy site files
        run: |
          find /tmp/constitutional-defense-labs -mindepth 1 -not -path '/tmp/constitutional-defense-labs/.git*' -delete 2>/dev/null || true
          cp -r constitutional-defense-labs-site/. /tmp/constitutional-defense-labs/
          touch /tmp/constitutional-defense-labs/.nojekyll
          echo "Copied $(ls constitutional-defense-labs-site/*.html 2>/dev/null | wc -l) HTML files"

      - name: Commit and push
        run: |
          cd /tmp/constitutional-defense-labs
          git config user.email "deploy@franciscoholdingsinc.com"
          git config user.name "Empire Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: constitutional-defense-labs @ ${{ github.sha }}" || echo "Nothing to commit"
          git push origin main || git push --set-upstream origin main
          echo "Live: franciscoderek7.github.io/constitutional-defense-labs"
