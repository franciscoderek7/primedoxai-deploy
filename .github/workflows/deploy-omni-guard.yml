name: Deploy OmniGuard (new rebrand) to omniaguard.com

on:
  push:
    branches: [main]
    paths:
      - 'omni-guard-site/**'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Verify OmniGuard spelling (zero tolerance)
        run: |
          ERRORS=$(grep -rln "OmniaGuard\|OMNIGUARD\|Omni Guard\|OMNI GUARD" omni-guard-site/ --include="*.html" | wc -l)
          echo "Spelling errors found: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: Wrong OmniGuard spelling detected"
            grep -rln "OmniaGuard\|OMNIGUARD\|Omni Guard" omni-guard-site/ --include="*.html"
            exit 1
          fi
          echo "PASS: OmniGuard spelling correct on all pages"

      - name: Verify no personal info leaked
        run: |
          LEAKS=$(grep -rln "franciscoderek7@gmail\|705-307-8080\|Kent St W\|K9V 2Z8" omni-guard-site/ --include="*.html" | wc -l)
          if [ "$LEAKS" -gt 0 ]; then
            echo "FAIL: Personal info found in source"
            grep -rln "franciscoderek7@gmail\|705-307-8080\|Kent St W\|K9V 2Z8" omni-guard-site/ --include="*.html"
            exit 1
          fi
          echo "PASS: Zero personal info in source"

      - name: Clone omniaguard repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/omniaguard.git /tmp/omniaguard
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Wipe old files
        run: |
          find /tmp/omniaguard -mindepth 1 -not -path '/tmp/omniaguard/.git*' -delete
          echo "Clean slate"

      - name: Copy site files
        run: |
          cd omni-guard-site
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.webp" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.svg" -o -name "*.gif" -o -name "*.ico" -o -name "*.xml" -o -name "*.txt" -o -name "*.md" \) | while read f; do
            dir=$(dirname "$f")
            mkdir -p "/tmp/omniaguard/$dir"
            cp "$f" "/tmp/omniaguard/$f"
          done
          echo "omniaguard.com" > /tmp/omniaguard/CNAME
          touch /tmp/omniaguard/.nojekyll
          echo "All files copied"

      - name: Commit and push to omniaguard repo
        run: |
          cd /tmp/omniaguard
          git config user.email "deploy@omniaguard.com"
          git config user.name "OmniGuard Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: auto-deploy from primedoxai-deploy @ ${{ github.sha }}

          CNAME: omniaguard.com
          Triggered by: push to franciscoderek7/primedoxai-deploy main" \
            || echo "Nothing to commit — already up to date"
          git push origin main
          echo "Pushed to franciscoderek7/omniaguard — live in ~2 minutes"

      - name: Summary
        run: |
          echo ""
          echo "================================================"
          echo "  OMNIGUARD (REBRAND) DEPLOYED"
          echo "================================================"
          echo "  Repo: franciscoderek7/omniaguard (main)"
          echo "  CNAME: omniaguard.com"
          echo "  Live in: ~2 minutes (GitHub Pages build)"
          echo ""
          echo "  Check: https://omniaguard.com"
          echo "================================================"
