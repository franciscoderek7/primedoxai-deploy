name: Deploy Space Swarm Inc.

on:
  push:
    branches: [main, claude/francisco-revenue-sprint-MEva6]
    paths:
      - 'space-swarm-site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Clone or init space-swarm repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/space-swarm.git /tmp/space-swarm 2>/dev/null || {
            mkdir -p /tmp/space-swarm
            cd /tmp/space-swarm
            git init -b main
            git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/space-swarm.git
          }
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Wipe and copy site files
        run: |
          find /tmp/space-swarm -mindepth 1 -not -path '/tmp/space-swarm/.git*' -delete 2>/dev/null || true
          cp -r space-swarm-site/. /tmp/space-swarm/
          touch /tmp/space-swarm/.nojekyll
          echo "Copied $(ls space-swarm-site/*.html 2>/dev/null | wc -l) HTML files"

      - name: Commit and push
        run: |
          cd /tmp/space-swarm
          git config user.email "deploy@franciscoholdingsinc.com"
          git config user.name "Empire Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: space-swarm @ ${{ github.sha }}" || echo "Nothing to commit"
          git push origin main || git push --set-upstream origin main
          echo "Live: franciscoderek7.github.io/space-swarm"
