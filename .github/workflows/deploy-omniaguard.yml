name: Deploy OMNIAGUARD to omniaguard.com

on:
  push:
    branches: [main, claude/francisco-revenue-sprint-MEva6]
    paths:
      - 'omniaguard-site/**'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout primedoxai-deploy
        uses: actions/checkout@v4

      - name: Verify OMNIAGUARD spelling — OMNIAGUARD is RETIRED 2026-06-19
        run: |
          # OMNIAGUARD is RETIRED. Only OMNIAGUARD (no 'ia') is correct.
          ERRORS=$(grep -rn "OMNIAGUARD\|OmnIAGuard\|OMNIAGUARD" omniaguard-site/ --include="*.html" | grep -v "OMNIAGUARD" | wc -l)
          echo "Retired spelling occurrences: $ERRORS"
          if [ "$ERRORS" -gt 0 ]; then
            echo "WARN: Retired OMNIAGUARD spelling detected (non-blocking)"
            grep -rn "OMNIAGUARD" omniaguard-site/ --include="*.html" | head -5
          fi
          echo "PASS: OMNIAGUARD spelling check complete"

      - name: Verify no personal info leaked
        run: |
          LEAKS=$(grep -rn "franciscoderek7@gmail\|705-307-8080\|Kent St W\|K9V 2Z8" omniaguard-site/ --include="*.html" | wc -l)
          if [ "$LEAKS" -gt 0 ]; then
            echo "FAIL: Personal info found in source"
            grep -rn "franciscoderek7@gmail\|705-307-8080\|Kent St W\|K9V 2Z8" omniaguard-site/ --include="*.html"
            exit 1
          fi
          echo "PASS: Zero personal info in source"

      - name: Clone omniaguard repo
        run: |
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/franciscoderek7/omniaguard.git /tmp/omniaguard
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Wipe old files
        run: |
          find /tmp/omniaguard -mindepth 1 -not -path '/tmp/omniaguard/.git*' -delete
          echo "Clean slate"

      - name: Copy site files
        run: |
          # Copy all HTML, JS, CSS, images, JSON and any other web assets
          cd omniaguard-site
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" -o -name "*.webp" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.svg" -o -name "*.gif" -o -name "*.ico" -o -name "*.xml" -o -name "*.txt" -o -name "*.md" \) | while read f; do
            dir=$(dirname "$f")
            mkdir -p "/tmp/omniaguard/$dir"
            cp "$f" "/tmp/omniaguard/$f"
          done
          echo "omniaguard.com" > /tmp/omniaguard/CNAME
          touch /tmp/omniaguard/.nojekyll
          echo "All files copied"

      - name: Commit and push to omniaguard repo
        run: |
          cd /tmp/omniaguard
          git config user.email "deploy@omniaguard.com"
          git config user.name "OMNIAGUARD Deploy Bot"
          git add -A
          git diff --cached --stat
          git commit -m "deploy: auto-deploy from primedoxai-deploy @ ${{ github.sha }}

          CNAME: omniaguard.com
          Triggered by: push to franciscoderek7/primedoxai-deploy" \
            || echo "Nothing to commit — already up to date"
          git push origin main
          echo "Pushed to franciscoderek7/omniaguard — live in ~2 minutes"

      - name: Verify CNAME in deployed repo
        run: |
          cat /tmp/omniaguard/CNAME
          echo "GitHub Pages will serve omniaguard.com from this repo"

      - name: Summary
        run: |
          echo ""
          echo "================================================"
          echo "  OMNIAGUARD DEPLOYED"
          echo "================================================"
          echo "  Repo: franciscoderek7/omniaguard (main)"
          echo "  CNAME: omniaguard.com"
          echo "  Files: $(find /tmp/omniaguard -not -path '*/.git*' -type f | wc -l) total"
          echo "  Live in: ~2 minutes (GitHub Pages build)"
          echo ""
          echo "  Check: https://omniaguard.com"
          echo "  DNS check: https://dnschecker.org/#A/omniaguard.com"
          echo "================================================"
