<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDox AI — 3D Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#e5e4e2;font-family:'Segoe UI',sans-serif;overflow:hidden}
        #canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
        .ui-overlay{position:fixed;z-index:10;padding:1.2rem;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
        .header{display:flex;justify-content:space-between;align-items:center;pointer-events:auto;border-bottom:1px solid rgba(0,212,255,0.05);padding-bottom:0.5rem}
        .logo{font-size:1.5rem;font-weight:300;letter-spacing:8px;background:linear-gradient(135deg,#D4AF37,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .badge{font-size:0.6rem;color:#606080;border:1px solid rgba(255,255,255,0.05);padding:0.2rem 1rem;border-radius:20px}
        .panels{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;pointer-events:auto;flex:1;padding:0.5rem 0}
        .panel{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:0.8rem;transition:0.3s}
        .panel:hover{border-color:rgba(0,212,255,0.15)}
        .panel .label{font-size:0.5rem;color:#606080;letter-spacing:2px;text-transform:uppercase}
        .panel .value{font-size:1.2rem;font-weight:300;color:#e5e4e2}
        .panel .value.gold{color:#D4AF37}
        .panel .value.blue{color:#00d4ff}
        .panel .sub{font-size:0.6rem;color:#404060}
        .bottom{display:flex;justify-content:space-between;align-items:center;pointer-events:auto;border-top:1px solid rgba(255,255,255,0.03);padding-top:0.5rem;flex-wrap:wrap;gap:0.5rem}
        .chat-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:0.5rem 1rem;max-width:400px;width:100%;max-height:60px;overflow-y:auto}
        .chat-box .msg{font-size:0.65rem;color:#606080}
        .chat-box .msg .sender{color:#00d4ff;font-weight:600}
        .voice-btn{background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.1);border-radius:50%;width:40px;height:40px;font-size:1.1rem;cursor:pointer;transition:0.3s;color:#e5e4e2;pointer-events:auto}
        .voice-btn:hover{border-color:rgba(0,212,255,0.3)}
        .chat-input{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:0.4rem 0.8rem;color:#e5e4e2;width:150px;font-size:0.65rem;pointer-events:auto}
        .chat-input:focus{outline:none;border-color:rgba(0,212,255,0.15)}
        @media(max-width:768px){.panels{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div id="canvas"></div>
<div class="ui-overlay">
    <div class="header">
        <div class="logo">🧠 PrimeDox AI</div>
        <div><span class="badge">LEGAL · DOCS · RESEARCH</span></div>
    </div>
    <div class="panels">
        <div class="panel"><div class="label">🧠 Status</div><div class="value blue">ONLINE</div><div class="sub">Your clone · Active</div></div>
        <div class="panel"><div class="label">📄 Documents</div><div class="value gold">31</div><div class="sub">Loaded · Ready</div></div>
        <div class="panel"><div class="label">⚖️ Cases</div><div class="value gold">3</div><div class="sub">CV-64 · CV-63 · CIBC</div></div>
        <div class="panel"><div class="label">📧 Gmail</div><div class="value blue">CONNECTED</div><div class="sub">4 accounts</div></div>
        <div class="panel"><div class="label">🧠 RAG</div><div class="value gold">ACTIVE</div><div class="sub">All models</div></div>
        <div class="panel"><div class="label">📊 Revenue</div><div class="value gold">$49,950</div><div class="sub">PrimeDox AI stream</div></div>
    </div>
    <div class="bottom">
        <div class="chat-box" id="chatBox"><div class="msg"><span class="sender">PrimeDox</span> I'm online, Emperor. How can I assist?</div></div>
        <div style="display:flex;gap:0.5rem;align-items:center;pointer-events:auto;flex-wrap:wrap;">
            <button class="voice-btn" onclick="toggleVoice()" id="voiceBtn">🎤</button>
            <input class="chat-input" type="text" id="chatInput" placeholder="Type or speak..." onkeydown="if(event.key==='Enter')sendCommand()">
        </div>
    </div>
</div>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a0f);
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,6);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.getElementById('canvas').appendChild(renderer.domElement);
const ambient=new THREE.AmbientLight(0x222244,0.5);scene.add(ambient);
const dirLight=new THREE.DirectionalLight(0x00d4ff,1);dirLight.position.set(5,10,5);scene.add(dirLight);
const towerGroup=new THREE.Group();
const towerMat=new THREE.MeshPhysicalMaterial({color:0x00d4ff,transparent:true,opacity:0.06,metalness:0.9,roughness:0.1});
const tower=new THREE.Mesh(new THREE.BoxGeometry(0.6,2.5,0.6),towerMat);tower.position.y=0.5;towerGroup.add(tower);
for(let i=0;i<30;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.02,0.7),new THREE.MeshPhysicalMaterial({color:i%2===0?0x00d4ff:0xd4af37,transparent:true,opacity:0.08}));f.position.y=i*0.06+0.1;towerGroup.add(f)}
scene.add(towerGroup);
const pGeo=new THREE.BufferGeometry();const pPos=new Float32Array(150*3);for(let i=0;i<150*3;i++)pPos[i]=(Math.random()-0.5)*12;pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pMat=new THREE.PointsMaterial({color:0x00d4ff,size:0.02,transparent:true,opacity:0.15,blending:THREE.AdditiveBlending});const particles=new THREE.Points(pGeo,pMat);scene.add(particles);
let mx=0,my=0;document.addEventListener('mousemove',(e)=>{mx=(e.clientX/window.innerWidth)*2-1;my=-(e.clientY/window.innerHeight)*2+1});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
function animate(){requestAnimationFrame(animate);towerGroup.rotation.y+=0.003;particles.rotation.y+=0.0005;towerGroup.rotation.x+=(my*0.05-towerGroup.rotation.x)*0.01;towerGroup.rotation.z+=(-mx*0.05-towerGroup.rotation.z)*0.01;renderer.render(scene,camera)}
animate();
let voiceActive=false;const synth=window.speechSynthesis;
function addChat(sender,msg){const box=document.getElementById('chatBox');const div=document.createElement('div');div.className='msg';div.innerHTML=`<span class="sender">${sender}</span> ${msg}`;box.appendChild(div);box.scrollTop=box.scrollHeight;}
function toggleVoice(){voiceActive=!voiceActive;document.getElementById('voiceBtn').textContent=voiceActive?'🔴':'🎤';if(voiceActive){addChat('🎤','Listening...');const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();recognition.lang='en-US';recognition.onresult=(e)=>{const cmd=e.results[0][0].transcript;addChat('You',cmd);processCommand(cmd);voiceActive=false;document.getElementById('voiceBtn').textContent='🎤';};recognition.onerror=()=>{voiceActive=false;document.getElementById('voiceBtn').textContent='🎤';};recognition.start();setTimeout(()=>{if(voiceActive){recognition.stop();voiceActive=false;document.getElementById('voiceBtn').textContent='🎤';}},8000);}}
function processCommand(cmd){const lower=cmd.toLowerCase();if(lower.includes('status'))addChat('PrimeDox','All systems nominal. 31 documents loaded. 3 active cases.');else if(lower.includes('documents'))addChat('PrimeDox','31 documents loaded. Ready for analysis.');else if(lower.includes('court'))addChat('PrimeDox','CV-64 hearing Aug 31, 2026. CV-63 pending.');else addChat('PrimeDox',`Processing: "${cmd}". I'll handle it.`);}
function sendCommand(){const input=document.getElementById('chatInput');const cmd=input.value.trim();if(!cmd)return;addChat('You',cmd);input.value='';processCommand(cmd);}
</script>
</body>
</html>
