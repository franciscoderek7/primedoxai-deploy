version: "3.9"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: primedox
      POSTGRES_PASSWORD: primedox
      POSTGRES_DB: primedox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://primedox:primedox@db:5432/primedox
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ../../backend/.env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
